<!doctype html>
<html><head><meta charset="utf-8"><title>WebGPU on the Intel HD 4000</title>
<style>body{font:22px/1.5 Menlo,monospace;margin:32px;background:#fff;color:#000}canvas{border:1px solid #888;margin-right:8px}</style>
</head><body>
<h2 style="font-family:-apple-system,sans-serif">WebGPU on the Intel HD 4000</h2><div id="out"></div>
<script>
const out = document.getElementById('out');
const log = (s) => { out.innerHTML += s.replace(/</g,'&lt;') + '<br>'; document.title = 'gpuprobe ' + s.slice(0,60); };
window.onerror = (m) => log('JS ERROR ' + m);

// ---- WebGPU
(async () => {
  try {
    if (!navigator.gpu) { log('WEBGPU navigator.gpu missing'); return; }
    const ad = await navigator.gpu.requestAdapter();
    if (!ad) { log('WEBGPU no adapter'); return; }
    const info = ad.info || {};
    log('WEBGPU adapter: ' + [info.vendor, info.architecture, info.device, info.description].join(' | '));
    const dev = await ad.requestDevice();
    dev.lost.then((i) => log('WEBGPU device lost: ' + i.message));
    dev.addEventListener('uncapturederror', (e) => log('WEBGPU error: ' + e.error.message));
    // compute: out[i] = i*i + 7 (storage buffers go through the argument-buffer path in WebKit's Metal backend)
    const N = 64;
    const sb = dev.createBuffer({size: N*4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC});
    const rb = dev.createBuffer({size: N*4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST});
    const cm = dev.createShaderModule({code: `@group(0) @binding(0) var<storage, read_write> o: array<u32>;
      @compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3u) { o[id.x] = id.x*id.x + 7u; }`});
    const cp = dev.createComputePipeline({layout: 'auto', compute: {module: cm, entryPoint: 'main'}});
    const bg = dev.createBindGroup({layout: cp.getBindGroupLayout(0), entries: [{binding: 0, resource: {buffer: sb}}]});
    let enc = dev.createCommandEncoder(); let pass = enc.beginComputePass();
    pass.setPipeline(cp); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(1); pass.end();
    enc.copyBufferToBuffer(sb, 0, rb, 0, N*4); dev.queue.submit([enc.finish()]);
    await rb.mapAsync(GPUMapMode.READ); const r = new Uint32Array(rb.getMappedRange().slice(0)); rb.unmap();
    let bad = 0; for (let i = 0; i < N; i++) if (r[i] !== i*i+7) bad++;
    log('WEBGPU compute: ' + (bad ? 'WRONG ' + bad + '/' + N + ' first=' + Array.from(r.slice(0,6)).join(',') : 'OK (64/64)'));
    // render to an offscreen texture with a uniform colour from a bind group, read the centre pixel
    const tex = dev.createTexture({size: [64, 64], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC});
    const ub = dev.createBuffer({size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST});
    dev.queue.writeBuffer(ub, 0, new Float32Array([0, 1, 0, 1]));
    const rm = dev.createShaderModule({code: `@group(0) @binding(0) var<uniform> col: vec4f;
      @vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
        var p = array(vec2f(-1,-1), vec2f(3,-1), vec2f(-1,3)); return vec4f(p[i], 0, 1); }
      @fragment fn fs() -> @location(0) vec4f { return col; }`});
    const rp = dev.createRenderPipeline({layout: 'auto', vertex: {module: rm, entryPoint: 'vs'},
      fragment: {module: rm, entryPoint: 'fs', targets: [{format: 'rgba8unorm'}]}});
    const rbg = dev.createBindGroup({layout: rp.getBindGroupLayout(0), entries: [{binding: 0, resource: {buffer: ub}}]});
    const pb = dev.createBuffer({size: 256*64, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST});
    enc = dev.createCommandEncoder();
    const rpass = enc.beginRenderPass({colorAttachments: [{view: tex.createView(), loadOp: 'clear', clearValue: [0,0,1,1], storeOp: 'store'}]});
    rpass.setPipeline(rp); rpass.setBindGroup(0, rbg); rpass.draw(3); rpass.end();
    enc.copyTextureToBuffer({texture: tex}, {buffer: pb, bytesPerRow: 256}, [64, 64]); dev.queue.submit([enc.finish()]);
    await pb.mapAsync(GPUMapMode.READ); const px = new Uint8Array(pb.getMappedRange().slice(0)); pb.unmap();
    const o = 32*256 + 32*4;
    log('WEBGPU render centre = ' + Array.from(px.slice(o, o+4)).join(',') + ' (want 0,255,0,255; clear-only = 0,0,255,255)');
    log('DONE: compute and render verified on the GPU');
  } catch (e) { log('WEBGPU EXC ' + e); }
})();
</script></body></html>
